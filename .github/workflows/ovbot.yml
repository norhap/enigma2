name: ovbot

on:
  push:
    branches: [ develop ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@v2
        with:
          ref: 'develop'

      - uses: actions/setup-python@v2
        with:
          python-version: '3.13'

      - name: Build python 3.13
        run: |
          sudo apt-get -q update
          sudo apt-get install dos2unix
          pip install --upgrade pip autopep8 future
          ./CI/build.sh
